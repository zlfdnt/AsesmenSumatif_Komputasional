<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detektif Komputasi – Koding Kelas VII</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--b:#2f6bff;--p:#8b4dff;--o:#ff8a1f;--g:#12b886;--r:#ff4d6d;--y:#ffc61a;--ink:#1c2447}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#dff0ff,#f3e8ff 55%,#ffeedd);min-height:100vh}
h1,h2,h3,.bal{font-family:'Baloo 2',Nunito,sans-serif;margin:.2em 0}
#app{max-width:980px;margin:0 auto;padding:16px}
.btn{font:800 1rem Nunito;border:0;border-radius:14px;padding:11px 20px;color:#fff;background:var(--b);box-shadow:0 5px 0 #1b3fa0;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1b3fa0}
.btn.g{background:var(--g);box-shadow:0 5px 0 #0b7a5a}.btn.o{background:var(--o);box-shadow:0 5px 0 #b35c00}.btn.r{background:var(--r);box-shadow:0 5px 0 #a8203c}.btn.w{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9c6e6}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px #2f3a8a22;margin:12px 0}
input,select,textarea{font:600 1rem Nunito;width:100%;padding:12px;border:3px solid #d6d2f5;border-radius:14px;margin:6px 0}
input:focus,textarea:focus{outline:none;border-color:var(--p)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:10px 18px;border-radius:99px;border:3px solid #d6d2f5;background:#fff;font-weight:800;cursor:pointer}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.hero{text-align:center;padding:26px 10px;position:relative;overflow:hidden}
.hero h1{font-size:2.4rem;color:var(--p)}
.fl{position:absolute;font-size:2.2rem;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tile{border-radius:22px;padding:20px;color:#fff;cursor:pointer;box-shadow:0 6px 0 #0003;min-height:150px}
.tile:active{transform:translateY(3px)}.tile .e{font-size:2.6rem}.tile h3{font-size:1.3rem}
.t1{background:linear-gradient(135deg,#2f6bff,#6aa0ff)}.t2{background:linear-gradient(135deg,#8b4dff,#c18bff)}.t3{background:linear-gradient(135deg,#ff8a1f,#ffc61a)}
.t4{background:linear-gradient(135deg,#12b886,#63e6be)}.t5{background:linear-gradient(135deg,#ff4d6d,#ff9ab0)}
details{background:#f7f6ff;border-radius:16px;padding:12px 16px;margin:8px 0;border:2px solid #e0dcff}
summary{font-weight:800;cursor:pointer;font-size:1.05rem}
.ex{background:#fff7d6;border-left:6px solid var(--y);padding:8px 12px;border-radius:10px;margin:8px 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:14px;border:3px solid #d6d2f5;background:#fff;font:700 1rem Nunito;cursor:pointer}
.opt.sel{border-color:var(--p);background:#efe6ff}.opt.ok{border-color:var(--g);background:#dcfaee}.opt.no{border-color:var(--r);background:#ffe3e8}
.prog{height:14px;background:#e4e0ff;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--b));transition:width .3s}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:8px;border-bottom:1px solid #e5e2fa;text-align:left;vertical-align:top}th{background:#efe9ff}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:#e0dcff;font-weight:800;font-size:.8rem}
.sortrow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0;padding:8px;background:#f7f6ff;border-radius:12px}
.seq{min-height:46px;padding:8px;border:3px dashed #c4bdf5;border-radius:14px;margin:8px 0}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.modal>div{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.warn{background:#fff0d6;border:3px solid var(--o);border-radius:14px;padding:8px 12px;font-weight:800}
code,pre{background:#1c2447;color:#c9f7e6;border-radius:12px;padding:10px;display:block;white-space:pre-wrap;font:600 .95rem ui-monospace,Menlo,monospace}
.tkh{display:flex;justify-content:space-between;align-items:center;background:#0f2a6b;color:#fff;padding:12px 16px;border-radius:16px 16px 0 0}
.tmr{font:800 1.6rem 'Baloo 2';background:#fff;color:#0f2a6b;border-radius:12px;padding:2px 14px}.tmr.lo{background:var(--r);color:#fff;animation:pl 1s infinite}
.tkb{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:3px solid #0f2a6b;border-top:0}
@media(max-width:760px){.tkb,.labg{grid-template-columns:1fr!important}}
.tks{padding:16px;background:#f2f6ff;border-right:3px solid #dfe6fb;user-select:none;-webkit-user-select:none}.tkq{padding:16px;user-select:none;-webkit-user-select:none}
.tks pre{margin:6px 0}.tks table{margin:8px 0}
.tkn{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#fff;border:3px solid #0f2a6b;border-top:0}
.nb{width:38px;height:38px;border-radius:10px;border:2px solid #c9d4f5;background:#fff;font-weight:800;cursor:pointer}
.nb.cur{outline:3px solid var(--b)}.nb.ans{background:var(--g);color:#fff;border-color:var(--g)}.nb.rg{background:var(--o);color:#fff;border-color:var(--o)}
.tkf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;background:#e8eeff;border-radius:0 0 16px 16px}
.alm{position:fixed;inset:0;background:#b00020;color:#fff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;animation:pl .8s infinite}
@keyframes pl{50%{filter:brightness(1.35)}}
.pop{animation:pop .25s}@keyframes pop{50%{transform:scale(1.04)}}
.ring{width:170px;height:170px;border-radius:50%;margin:12px auto;display:grid;place-items:center;background:conic-gradient(var(--g) calc(var(--s)*1%),#e4e0ff 0)}
.ring b{background:#fff;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font:800 2.8rem 'Baloo 2'}
.cf{position:fixed;top:-30px;font-size:1.8rem;animation:cf 3s linear forwards;z-index:50;pointer-events:none}@keyframes cf{to{transform:translateY(110vh) rotate(360deg)}}
.pb.b{border-color:#12b886}.pb.s{border-color:#ffc61a}.pb.k{border-color:#ff4d6d}
.arena{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:320px}.cell{aspect-ratio:1;background:#e9f6ff;border-radius:10px;display:grid;place-items:center;font-size:1.8rem;position:relative}.cell.w{background:#d9b48a}.cell.err{background:#ffd0d6}
.pl{display:flex;gap:6px;flex-wrap:wrap}.ins{display:flex;align-items:center;gap:6px;background:#f7f6ff;border:2px solid #e0dcff;border-radius:12px;padding:6px 10px;margin:4px 0;font-weight:800}.ins.run{background:#fff3b0;border-color:var(--y)}.ins.bad{background:#ffe3e8;border-color:var(--r)}
.labg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.tab{flex:0 0 auto;padding:10px 16px;border-radius:99px;border:3px solid #d6d2f5;background:#fff;font:800 1rem Nunito;cursor:pointer;color:var(--ink)}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.mt{font-size:1.08rem;line-height:1.6}.lead{font-size:1.15rem}.mt h3{font-size:1.5rem;color:var(--p)}
.gt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.gc{border:3px solid #d6d2f5;background:#fff;border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;font:700 1rem Nunito;color:var(--ink);display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .15s}
.gc .ge{font-size:2.4rem}.gc small{color:#6a6f99}.gc:hover{transform:translateY(-3px)}.gc.act{background:#efe6ff;border-color:var(--p);transform:scale(1.04)}
.det{margin-top:12px;padding:14px;border-radius:18px;background:#f7f6ff;border:3px dashed #c4bdf5}.det h3{margin-top:0}
.cx{display:inline-block;background:#fff;border:2px solid #e0dcff;border-radius:99px;padding:6px 12px;margin:3px;font-weight:700}
.scene{text-align:center;background:linear-gradient(135deg,#eaf3ff,#f6eaff);border-radius:18px;padding:14px;margin:8px 0;font-size:3rem}
.scene small{display:block;font-size:1rem;font-weight:700;color:#4a5280}.bigt{font:800 2.4rem 'Baloo 2'}
.fl2{cursor:pointer;border-radius:16px;border:3px solid #d6d2f5;margin:8px 0;overflow:hidden}.ff{background:#fff;padding:14px;font-weight:800}.fb{display:none;background:#e6fbf3;padding:14px;font-weight:700}.fl2.on .ff{display:none}.fl2.on .fb{display:block}
.tn{background:#efe6ff;border:2px solid #c4bdf5;border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:800;cursor:pointer}.tc{margin-left:22px;border-left:4px solid #c4bdf5;padding-left:10px}.hid{display:none}
.cl{display:block;width:100%;text-align:left;background:#1c2447;color:#c9f7e6;border:0;border-radius:8px;padding:6px 10px;font:700 1rem ui-monospace,Menlo,monospace;cursor:pointer;margin:2px 0;white-space:pre}.cl.act{background:#3b2f8f}
.bd{background:#ffe3e8;border-left:6px solid var(--r);padding:8px 12px;border-radius:10px;margin:6px 0}.gd{background:#dcfaee;border-left:6px solid var(--g);padding:8px 12px;border-radius:10px;margin:6px 0}
.cmp3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.hint{text-align:center;color:#6a6f99;font-weight:700}.qz{box-shadow:none;border:2px solid #e0dcff}
.hd .hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.kls{background:linear-gradient(135deg,var(--p),var(--b));color:#fff;font-weight:800;border-radius:99px;padding:6px 14px}
.tj{background:#fff7d6;border-left:6px solid var(--y);border-radius:12px;padding:8px 14px;margin-top:10px}.tj ol{margin:4px 0 0 18px;padding:0}
.sub{border:3px solid #c4bdf5;border-radius:20px;padding:14px;margin:18px 0;background:#fcfbff}.sub.s2{border-color:#12b886;background:#f4fffb}
.sl{display:inline-block;background:var(--p);color:#fff;font-weight:800;border-radius:99px;padding:4px 14px;margin-bottom:8px}.s2 .sl{background:var(--g)}
.demo,.note{margin:8px 0}.note{font-weight:700;color:#4a5280}
.chat{display:flex;flex-direction:column;gap:6px}.bub{background:#e9f0ff;border-radius:16px 16px 16px 4px;padding:8px 12px;max-width:85%}.bub.r{align-self:flex-end;background:#dcfaee;border-radius:16px 16px 4px 16px}.docx{background:#fff;border:2px solid #e0dcff;border-radius:10px;padding:8px 12px;margin-top:8px}
.mini{max-width:260px}.bars{display:flex;gap:10px;align-items:flex-end;height:90px;margin:8px 0}.bars i{flex:1;max-width:60px;background:linear-gradient(var(--b),var(--p));border-radius:8px 8px 0 0;color:#fff;font:800 .9rem Nunito;text-align:center;font-style:normal}
.wave{display:flex;gap:3px;align-items:flex-end;height:46px}.wave span{width:8px;height:10px;background:var(--p);border-radius:4px}.wave.on span{animation:wv .45s infinite alternate}.wave span:nth-child(odd){animation-delay:.15s}@keyframes wv{to{height:44px}}
.stg{position:relative;height:130px;background:linear-gradient(#bfe6ff,#e6f7ff 68%,#8bd17c 68%);border-radius:14px;overflow:hidden;font-size:2.2rem}.car{position:absolute;bottom:12px;left:-50px}.stg.on .car{animation:drive 6s linear forwards}@keyframes drive{to{left:105%}}
.sun{position:absolute;right:12px;top:6px}.stg.on .sun{animation:spin 6s linear}@keyframes spin{to{transform:rotate(360deg)}}.cld{position:absolute;top:10px;left:15%}.stg.on .cld{animation:cld 6s linear forwards}@keyframes cld{to{left:80%}}
.vc{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}.vp{flex:1;min-width:80px;height:10px;background:#dde;border-radius:99px;overflow:hidden}.vp i{display:block;height:100%;width:0;background:var(--r)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.vcd{background:#fff;border:2px solid #e0dcff;border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}.vcd small{color:#6a6f99}.vv{min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.num{font:800 1.3rem 'Baloo 2'}.rul{width:100%;height:22px;background:repeating-linear-gradient(90deg,#ffe08a 0 9px,#e0b43a 9px 10px);border-radius:4px;position:relative}.rul i{position:absolute;left:0;top:-4px;bottom:-4px;width:75%;border-right:4px solid var(--r)}
.th{width:20px;height:60px;border:3px solid #7a7f9f;border-radius:10px;position:relative;overflow:hidden;background:#fff}.th i{position:absolute;bottom:0;left:0;right:0;height:60%;background:var(--r)}
.ppl{font-size:.8rem;line-height:1;max-width:150px;word-break:break-all}.badge{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--b));color:#fff;display:grid;place-items:center;font:800 1.6rem 'Baloo 2'}
.sw{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:2rem}.sw.soft{background:radial-gradient(#fff,#e8e4ff);box-shadow:0 6px 14px #8b4dff33}.meter{width:90px;height:10px;background:#ffe3e8;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:80%;background:linear-gradient(90deg,var(--y),var(--r))}
.pulse{animation:pl 1s infinite}.fbk{background:#fff7f0;border:2px solid #ffd2a6;border-radius:14px;padding:10px 14px;margin:8px 0}.tpb{margin:8px 0}.tpb .prog i{background:linear-gradient(90deg,var(--o),var(--g))}
/* ===== TAMBAHAN: HP, tujuan, contoh, video, status kirim ===== */
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,.chip,.tab,.gc,.opt,.tile,.cl,.nb,.fl2,.tn{touch-action:manipulation}
.btn{min-height:44px}.ins .btn{min-height:36px}
details.tj{background:#fff7d6;border:0;border-left:6px solid var(--y);border-radius:12px;padding:10px 14px;margin-top:12px}
.tj summary{font-size:1.1rem}.tj ol{margin:8px 0 2px 18px;padding:0}.tj li{margin:5px 0}
.sub{margin:28px 0 0}.sl{font-size:1.05rem}
.sep{text-align:center;margin:20px 0 0;font-weight:800;color:#6a6f99}
button.cx{cursor:pointer;font:700 1rem Nunito;color:var(--ink)}button.cx.on{background:var(--p);color:#fff;border-color:var(--p)}
.exv{margin:8px 0;padding:12px;background:#fff;border:3px dashed #c4bdf5;border-radius:14px}.exv:empty{display:none}
.mscr{background:#1c2447;color:#c9f7e6;border-radius:12px;padding:12px;text-align:center;font-weight:700;margin-bottom:8px}
.vidf{border:4px solid #1c2447;border-radius:16px;overflow:hidden}.vidf .stg{border-radius:0}
.stg span{position:absolute}
.stg.tt{background:linear-gradient(135deg,#ff9ad5,#8b4dff)}.stg.tt .s1{left:44%;bottom:14px;font-size:3rem}.stg.tt .s2{left:20%;bottom:20px}.stg.tt .s3{right:18%;top:14px}
.stg.tt.on .s1{animation:bnc .35s ease-in-out infinite alternate}.stg.tt.on .s2{animation:flt 1.2s linear infinite}.stg.tt.on .s3{animation:blk .4s steps(2) infinite}
.stg.pr{background:linear-gradient(#fff8e6,#ffe8b8)}.stg.pr .s1{left:8%;bottom:12px;font-size:3rem}.stg.pr .s2,.stg.pr .s3,.stg.pr .s4{right:12%;top:18px;font-size:3.4rem;opacity:0}.stg.pr .s2{opacity:1}
.stg.pr.on .s1{animation:bn2 .6s ease-in-out infinite alternate}.stg.pr.on .s2{animation:sl1 4s forwards}.stg.pr.on .s3{animation:sl2 4s forwards}.stg.pr.on .s4{animation:sl3 4s forwards}
.stg.fm{background:radial-gradient(circle at 70% 30%,#2a2f6b,#05071a)}.stg.fm .s1{left:-60px;bottom:40px;font-size:2.6rem}.stg.fm .s2{left:20%;top:10px}.stg.fm .s3{right:15%;top:30px}.stg.fm .s4{right:8%;bottom:10px;font-size:2.8rem}
.stg.fm.on .s1{animation:drive 4s linear forwards}.stg.fm.on .s2,.stg.fm.on .s3{animation:blk .5s steps(2) infinite}
.stg.tu{background:#1c2447}.stg.tu .s1{left:6%;top:14px;font:700 .95rem ui-monospace,Menlo,monospace;color:#c9f7e6;white-space:nowrap;overflow:hidden;width:0}
.stg.tu .s2{right:10%;bottom:10px;font-size:2.6rem}.stg.tu .s3{left:6%;top:46px;font:700 .95rem ui-monospace,Menlo,monospace;color:#ffc61a;opacity:0}
.stg.tu.on .s1{animation:typ 2.4s steps(14) forwards}.stg.tu.on .s2{animation:bn2 .3s infinite alternate}.stg.tu.on .s3{animation:sh 4s forwards}
@keyframes bnc{to{transform:translateY(-34px) rotate(8deg)}}@keyframes bn2{to{transform:translateY(-8px)}}
@keyframes flt{from{transform:translateY(0);opacity:1}to{transform:translateY(-90px);opacity:0}}@keyframes blk{50%{opacity:.2}}
@keyframes sl1{0%,30%{opacity:1}33%,100%{opacity:0}}@keyframes sl2{0%,33%{opacity:0}36%,63%{opacity:1}66%,100%{opacity:0}}@keyframes sl3{0%,66%{opacity:0}70%,100%{opacity:1}}
@keyframes typ{to{width:14ch}}@keyframes sh{0%,60%{opacity:0}65%,100%{opacity:1}}
.sb{position:sticky;top:0;z-index:20;padding:10px 14px;border-radius:14px;font-weight:800;margin:8px 0;box-shadow:0 4px 14px #0003}
.sb.wait{background:#fff3b0;border:3px solid var(--y)}.sb.ok{background:#dcfaee;border:3px solid var(--g)}.sb.err{background:#ffe3e8;border:3px solid var(--r)}
.sortrow>span:first-child{flex:1 1 220px}.sortrow .btn{padding:8px 12px;min-height:40px}
.wtg{display:none}.wb{overflow-x:auto}

 #app{padding:10px}.card{padding:14px;border-radius:18px}

/* ===== kartu bentuk data ===== */
#bt_d{border:0;background:none;padding:0;margin-top:14px}
.bkh{display:flex;gap:12px;align-items:center;color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 #0002}
.bke{font-size:2.6rem;line-height:1}.bkh h3{margin:0;font-size:1.4rem;color:#fff}.bkh p{margin:2px 0 0;font-weight:700}
.bks{background:#fff;border:2px solid #e0dcff;border-radius:16px;padding:12px;margin-top:12px}
.lbl{display:block;margin-bottom:8px;color:var(--p);font-weight:800}

function pick(id,i){const it=GD[id][i];document.querySelectorAll(`[id^="${id}_t"]`).forEach(b=>b.classList.remove("act"));$(`#${id}_t${i}`).classList.add("act");const d=$(`#${id}_d`);d.innerHTML=it.h;d.classList.remove("pop");void d.offsetWidth;d.classList.add("pop");log("Buka kartu materi",it.t)}

function msort(id,items,labs){SS[id]={items,labs,i:0,ok:0,a:false};return `<div class="ms" id="${id}"></div>`}

function morder(id,steps){SO[id]={steps,p:[],sh:shuf(steps.length)};return `<div class="mo" id="${id}"></div>`}
function moRender(id){const S=SO[id];$("#"+id).innerHTML=`<p>Ketuk langkah sesuai urutan yang benar:</p><div class="seq">${S.p.map((s,n)=>`<span class="pill">${n+1}. ${esc(S.steps[s])}</span> `).join("")||"<i>(belum ada)</i>"}</div>${S.sh.filter(s=>!S.p.includes(s)).map(s=>`<button class="opt" onclick="SO['${id}'].p.push(${s});moRender('${id}')">${esc(S.steps[s])}</button>`).join("")}<button class="btn w" onclick="SO['${id}'].p=[];moRender('${id}')">↺ Ulangi</button> <button class="btn g" onclick="moCek('${id}')">✅ Periksa</button><p id="${id}_m"></p>`}
function moCek(id){const S=SO[id],ok=S.p.length==S.steps.length&&S.p.every((s,n)=>s==n);log("Urutkan langkah",id+": "+(ok?"benar":"salah"));if(S.p.length==S.steps.length)later(ok?"ok":"no");$("#"+id+"_m").innerHTML=ok?"🎉 <b>Tepat!</b> Itulah algoritma yang benar.":S.p.length<S.steps.length?"Lengkapi dulu semua langkahnya ya.":"💭 Urutannya belum tepat. Pikirkan mana yang harus dikerjakan lebih dulu."}

function quiz(key,qs,fin){QZ[key]={qs,a:{},fin};return qs.map((q,k)=>`<div class="card qz"><div class="scene">${q[4][0]}<small>${q[4][1]}</small></div><b>${k+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="opt" id="${key}_${k}_${j}" onclick="cekQ('${key}',${k},${j})">${o}</button>`).join("")}<div id="${key}_w${k}"></div></div>`).join("")+`<p id="${key}_done" class="pill"></p>`}
function cekQ(key,k,j){const Z=QZ[key];if(Z.a[k]!==undefined)return;Z.a[k]=j;const q=Z.qs[k];
  q[1].forEach((_,x)=>$(`#${key}_${k}_${x}`).classList.add(x==q[2]?"ok":x==j?"no":"opt"));
  $(`#${key}_w${k}`).innerHTML=`<div class="${j==q[2]?"gd":"bd"}">${j==q[2]?"🎉 Tepat! ":"💭 Belum tepat. "}${q[3]}</div>`;
  log("Latihan "+key,`Soal ${k+1}: ${j==q[2]?"benar":"salah"}`);later(j==q[2]?"ok":"no");
  if(Object.keys(Z.a).length==Z.qs.length){const n=Z.qs.filter((qq,x)=>Z.a[x]==qq[2]).length;$(`#${key}_done`).textContent=`✅ Latihan selesai: ${n}/${Z.qs.length} benar`;Z.fin&&Z.fin()}}

function alarm(){
  try{const c=ac();if(c){
    const t0=c.currentTime+.03,dur=6,comp=c.createDynamicsCompressor();
    comp.threshold.value=-40;comp.knee.value=0;comp.ratio.value=20;comp.attack.value=0;comp.release.value=.1;
    const m=c.createGain();m.gain.value=1.6;comp.connect(m);m.connect(c.destination);
    [["square",1,.8],["sawtooth",2,.5]].forEach(([ty,mul,v])=>{const o=c.createOscillator(),g=c.createGain();o.type=ty;g.gain.value=v;
      for(let i=0;i<dur*4;i++)o.frequency.setValueAtTime((i%2?1350:850)*mul,t0+i*.25);
      o.connect(g);g.connect(comp);o.start(t0);o.stop(t0+dur)})}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([500,150,500,150,500,150,500])}catch(e){}
  try{if("speechSynthesis" in window&&U){const u=new SpeechSynthesisUtterance(`Peringatan! ${U.nama}, terdeteksi melakukan pelanggaran.`);u.lang="id-ID";u.volume=1;u.rate=.95;setTimeout(()=>{try{speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}},6300)}}catch(e){}

function skorItem(k,a){const q=Q[k];
  if(q.t=="mc")return a==q.a?1:0;
  if(q.t=="mk"){const h=a.filter(x=>q.a.includes(x)).length,w=a.length-h;return Math.max(0,(h-w)/q.a.length)}
  if(q.t=="bs"||q.t=="sort")return q.items.filter((it,x)=>a[x]==it[1]).length/q.items.length;
  return q.steps.filter((_,x)=>a[x]==x).length/q.steps.length}
function keyTxt(q){
  if(q.t=="mc")return esc(q.o[q.a]);
  if(q.t=="mk")return q.a.map(i=>esc(q.o[i])).join("<br>");
  if(q.t=="bs")return q.items.map(it=>esc(it[0])+" → <b>"+(it[1]?"Benar":"Salah")+"</b>").join("<br>");
  if(q.t=="sort")return q.items.map(it=>esc(it[0])+" → <b>"+(it[1]?"Kuantitatif":"Kualitatif")+"</b>").join("<br>");
  return q.steps.map((s,n)=>(n+1)+". "+esc(s)).join("<br>")}
function ansTxt(q,a){
  if(q.t=="mc")return a>=0?esc(q.o[a]):"<i>(kosong)</i>";
  if(q.t=="mk")return a.length?a.map(i=>esc(q.o[i])).join("<br>"):"<i>(kosong)</i>";
  if(q.t=="bs")return q.items.map((it,x)=>esc(it[0])+" → <b>"+(a[x]==1?"Benar":a[x]==0?"Salah":"-")+"</b>").join("<br>");

  return a.length?a.map((s,n)=>(n+1)+". "+esc(q.steps[s])).join("<br>"):"<i>(kosong)</i>"}

function expand(p){

}

function viewGrafik(D,stuK){
  const K=G.kelas,sc=[["anak","🧑‍🎓 Per anak"],["kelas","🏫 Per kelas "+K],["semua","🌐 Keseluruhan"]];
  const tabs=`<div class="chips" style="margin-bottom:10px">${sc.map(([k,l])=>`<span class="chip ${G.scope==k?"on":""}" onclick="G.scope='${k}';dash()">${l}</span>`).join("")}</div>`;
  const nilaiUtama=ss=>ss.filter(s=>s.att.length).map(s=>s.att[0].skor);
  if(G.scope=="anak"){
    const s=stuK.find(x=>x.k==G.sel)||stuK.find(x=>x.att.length)||stuK[0];
    if(!s)return tabs+"<p>Belum ada siswa di kelas ini.</p>";
    const pick=`<select onchange="G.sel=this.value;dash()">${stuK.map(x=>`<option value="${esc(x.k)}" ${x.k==s.k?"selected":""}>${esc(x.nama)}</option>`).join("")}</select>`;
    return tabs+pick+statCards([[s.att.length?s.att[0].skor:"-","nilai utama (percobaan 1)"],[s.att.length,"percobaan"],[s.out+"×","pelanggaran"],[s.selesai.size+"/3","materi selesai"],[labPts(s),"poin Lab (terpisah)"]])+
      (s.att.length?`<h4 class="sh">Skor tiap percobaan</h4>${barsV(s.att.map(a=>["ke-"+a.ke+(a.ke==1?" ⭐":""),a.skor]),100)}<h4 class="sh">Pencapaian per topik (nilai utama)</h4>${barsH(topPct([s.att[0]]))}`:"<p>Siswa ini belum mengerjakan Asesmen Sumatif.</p>")}
  if(G.scope=="kelas"){
    const sub=stuK.filter(s=>s.att.length),sk=nilaiUtama(stuK);
    return tabs+statCards([[sub.length+"/"+stuK.length,"sudah mengumpulkan / terdaftar"],[sk.length?avgOf(sk):"-","rata-rata nilai utama"],[sk.length?Math.max(...sk):"-","tertinggi"],[sk.length?Math.min(...sk):"-","terendah"]])+
      `<h4 class="sh">Sebaran nilai utama</h4>${barsV(distB(sk),Math.max(1,...distB(sk).map(x=>x[1])))}<h4 class="sh">Pencapaian per topik (rata-rata kelas)</h4>${barsH(topPct(sub.map(s=>s.att[0])))}<h4 class="sh">Nilai utama tiap siswa</h4>${barsH(sub.map(s=>[s.nama,s.att[0].skor]))}`}
  const all=D.stu,sk=nilaiUtama(all),per=KELAS.map(k=>{const v=nilaiUtama(all.filter(s=>s.kelas==k));return[k,v.length?avgOf(v):0,undefined,v.length]});
  return tabs+statCards([[all.filter(s=>s.att.length).length+"/"+all.length,"sudah mengumpulkan / terdaftar"],[sk.length?avgOf(sk):"-","rata-rata nilai utama"],[sk.length?Math.max(...sk):"-","tertinggi"],[D.att.length,"total percobaan tercatat"]])+
    `<h4 class="sh">Rata-rata nilai utama tiap kelas</h4>${barsV(per.map(([k,v,c,n])=>[k+" ("+n+")",v,c]),100)}<h4 class="sh">Sebaran nilai utama (semua kelas)</h4>${barsV(distB(sk),Math.max(1,...distB(sk).map(x=>x[1])))}<h4 class="sh">Pencapaian per topik (semua kelas)</h4>${barsH(topPct(all.filter(s=>s.att.length).map(s=>s.att[0])))}`}
function viewLog(stuK,mat){
  const f=G.lf,list=stuK.filter(s=>!f||s.k==f),rows=[].concat(...list.map(s=>mat?s.mat:s.akt)).sort((a,b)=>(+a[5]||0)-(+b[5]||0)).reverse();
  const sel=`<select onchange="G.lf=this.value;dash()"><option value="">Semua siswa kelas ${G.kelas}</option>${stuK.map(s=>`<option value="${esc(s.k)}" ${s.k==f?"selected":""}>${esc(s.nama)}</option>`).join("")}</select>`;
  return sel+`<p class="note">${mat?"Aktivitas belajar materi: buka materi, latihan, uji cepat, Lab, contoh suara/video.":"Aktivitas akun & asesmen: login, mulai/selesai asesmen, pelanggaran, refleksi."} Menampilkan ${Math.min(rows.length,300)} dari ${rows.length} catatan terbaru.</p><div class="tbl"><table><tr><th>Waktu</th><th>Nama</th><th>Aktivitas</th><th>Detail</th></tr>${rows.slice(0,300).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join("")||"<tr><td colspan=4>Belum ada aktivitas.</td></tr>"}</table></div>`}
async function dash(refresh){
  if(!G.d||refresh){
    $("#app").innerHTML=`<div class="card hero"><h2>Memuat data…</h2><p>Mengambil data dari server, mohon tunggu.</p></div>`;
    try{const r=await api({action:"data",pass:U.pass});
      if(!r||r.ok===false||!Array.isArray(r.hasil))throw new Error((r&&r.err)||"server tidak mengembalikan data (aksi 'data' belum didukung / kata sandi ditolak)");
      G.d={hasil:r.hasil,logs:Array.isArray(r.logs)?r.logs:[]};
    }catch(e){G.d=null;const msg=e&&e.name=="AbortError"?"waktu tunggu habis (server lambat atau sinyal lemah)":String((e&&e.message)||e);
      $("#app").innerHTML=`<div class="card"><p class="warn">⚠️ Gagal memuat data.</p><p><b>Penyebab:</b> ${esc(msg)}</p><ul><li>Pastikan <b>Code.gs terbaru</b> sudah ditempel, lalu <b>Deploy → Manage deployments → Edit → New version</b> (akses: <b>Anyone</b>).</li><li>Lalu tekan <b>Coba lagi</b>.</li></ul><button class="btn o" onclick="dash(1)">🔄 Coba lagi</button> <button class="btn r" onclick="logout()">Keluar</button></div>`;return}}
  const D=buildD(),K=G.kelas,stuK=D.stu.filter(s=>s.kelas==K),attK=D.att.filter(a=>a.kelas==K);G.stu=stuK;
  const sub=stuK.filter(s=>s.att.length),sk=sub.map(s=>s.att[0].skor);
  let body="";
  if(G.tab=="nilai")body=viewNilai(attK);else if(G.tab=="siswa")body=viewSiswa(stuK);else if(G.tab=="grafik")body=viewGrafik(D,stuK);else body=viewLog(stuK,G.tab=="mat");
  const T=[["nilai","📋 Nilai Asesmen"],["siswa","🧑‍🎓 Siswa"],["grafik","📊 Grafik"],["akt","🕒 Log Aktivitas"],["mat","📚 Log Materi"]];
  $("#app").innerHTML=`<div class="bar card" style="margin-top:0"><div><h2>👩‍🏫 Dashboard Guru</h2><span class="pill">Kelas ${K}</span></div><div><button class="btn w" onclick="dash(1)">🔄 Muat ulang</button> <button class="btn g" onclick="csv()">⬇ Ekspor CSV</button> <button class="btn r" onclick="logout()">🚪 Keluar</button></div></div>
  <div class="chips">${KELAS.map(k=>`<span class="chip ${K==k?"on":""}" onclick="G.kelas='${k}';G.sel='';G.lf='';dash()">${k}</span>`).join("")}</div>
  ${statCards([[stuK.length,"siswa tercatat"],[sub.length,"sudah mengumpulkan"],[sk.length?avgOf(sk):"-","rata-rata nilai utama"],[sk.length?Math.max(...sk):"-","nilai utama tertinggi"]])}
  <div class="chips">${T.map(([k,l])=>`<span class="chip ${G.tab==k?"on":""}" onclick="G.tab='${k}';dash()">${l}</span>`).join("")}</div><div class="card">${body}</div>`;
}
async function hapusApi(p){
  try{const r=await api({action:"hapus",pass:U.pass,...p});if(!isOk(r)||typeof r.deleted!=="number")throw new Error((r&&r.err)||"server belum mendukung penghapusan (tempel Code.gs terbaru lalu Deploy versi baru)");return r}
  catch(e){alert("Gagal menghapus: "+((e&&e.message)||e));return null}}
async function hapusSiswa(i){const s=G.stu[i];if(!s)return;
  if(!confirm(`Hapus SEMUA data ${s.nama} (${s.kelas})?\n\nNilai, riwayat percobaan, dan log aktivitasnya dihapus permanen.\nSiswa bisa mengerjakan dari awal.`))return;
  const r=await hapusApi({scope:"siswa",nama:s.nama,kelas:s.kelas});if(r){alert(r.deleted+" baris data dihapus.");dash(1)}}
async function hapusPercobaan(gi){const r0=G.d.hasil[gi];if(!r0)return;
  if(!confirm(`Hapus satu percobaan ini?\n${r0[1]} • skor ${r0[3]} • ${r0[0]}\n\nJika ini percobaan ke-1, nilai utama akan beralih ke percobaan berikutnya.`))return;
  const r=await hapusApi({scope:"percobaan",id:r0[6]});if(r)dash(1)}
async function hapusKelas(){const t=prompt(`PERINGATAN: semua nilai dan log kelas ${G.kelas} akan dihapus permanen.\nKetik  HAPUS ${G.kelas}  untuk melanjutkan:`);
  if(t!=="HAPUS "+G.kelas)return alert("Dibatalkan.");const r=await hapusApi({scope:"kelas",kelas:G.kelas});if(r){alert(r.deleted+" baris data dihapus.");dash(1)}}
function lihat(gi){
  const r=G.d.hasil[gi];let j;try{j=JSON.parse(r[5])}catch(e){return alert("Data rusak")}
  const rf=G.d.logs.filter(x=>nk(x[1])==nk(r[1])&&x[2]==r[2]&&x[3]=="Refleksi").map(x=>esc(x[4]).replace(" || ","<br>")).join("<hr>")||"-";
  const m=document.createElement("div");m.className="modal";m.onclick=e=>{if(e.target==m)m.remove()};
  m.innerHTML=`<div><div class="bar"><h3>${esc(r[1])} • ${esc(r[2])} • Skor ${esc(r[3])}${j.forced?" • ⛔ Dihentikan":""}</h3><button class="btn r" onclick="this.closest('.modal').remove()">Tutup</button></div>
  ${Q.map((q,k)=>{const p=j.p[k];return`<div class="card" style="box-shadow:none;border:3px solid ${p==1?"#12b886":p>0?"#ffc61a":"#ff4d6d"}"><b>${k+1}. ${esc(q.q)}</b><br><small>Jawaban siswa:</small><br>${ansTxt(q,j.a[k])}<br><small>Kunci:</small><br>${keyTxt(q)}<br><small>Nilai soal: ${Math.round(p*100)}%</small></div>`}).join("")}
  <div class="card"><b>Refleksi siswa</b><p>${rf}</p></div></div>`;
  document.body.appendChild(m);
}

function grafikSiswa(i){const s=G.stu[i];if(!s)return;G.tab='grafik';G.scope='anak';G.sel=s.k;dash()}
function csv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"',cnt={},rows=[["Waktu","Nama","Kelas","Skor","Durasi(detik)","Percobaan","Jenis"],...G.d.hasil.map(r=>{const k=nk(r[1])+"|"+r[2];cnt[k]=(cnt[k]||0)+1;return[...r.slice(0,5),cnt[k],cnt[k]==1?"Nilai utama":"Percobaan ulang"]})];
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="nilai_koding_kelas7.csv";a.click();
}

flushPending();flushLogs();
if(U&&U.role=="guru")dash();else if(U){refreshHist();home()}else login();
</script></body></html>
